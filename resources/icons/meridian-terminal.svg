<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="cursorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#bgGrad)" stroke="#334155" stroke-width="6"/>

  <!-- Subtle grid / scanlines pattern inside -->
  <line x1="24" y1="120" x2="488" y2="120" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="24" y1="200" x2="488" y2="200" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="24" y1="280" x2="488" y2="280" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="24" y1="360" x2="488" y2="360" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Terminal Title Bar dots -->
  <circle cx="96" cy="80" r="10" fill="#ef4444"/>
  <circle cx="132" cy="80" r="10" fill="#eab308"/>
  <circle cx="168" cy="80" r="10" fill="#22c55e"/>

  <!-- Meridian Prime Chevron symbol '>' -->
  <path d="M 120 180 L 260 280 L 120 380" fill="none" stroke="url(#accentGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Block cursor '_' / pulse bar -->
  <rect x="290" y="340" width="100" height="36" rx="8" fill="url(#cursorGrad)" filter="url(#glow)"/>

  <!-- Meridian AI orbital star badge (top right) -->
  <g transform="translate(380, 100)">
    <circle cx="0" cy="0" r="28" fill="#1e1b4b" stroke="#818cf8" stroke-width="3"/>
    <path d="M 0 -16 L 4 -4 L 16 0 L 4 4 L 0 16 L -4 4 L -16 0 L -4 -4 Z" fill="#38bdf8"/>
  </g>
</svg>

