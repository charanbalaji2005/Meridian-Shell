name: Meridian Terminal Linux CI/CD & Releases

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Linux Multi-Distro Build & Automated Test Suite
  # ---------------------------------------------------------------------------
  linux-build:
    name: Linux Build (Ubuntu / Debian / Fedora / Arch)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ make cmake rpm dpkg-dev

    - name: Build All Targets
      run: make -j$(nproc) all

    - name: Run Automated Test Suite (126 tests)
      run: make test

    - name: Run Manual PTY Core Tests
      run: make manual-test

    - name: Generate All Offline Linux Packages (.deb, .rpm, .tar.gz, AppImage)
      run: |
        ./scripts/build_all_releases.sh

    - name: Upload Linux Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: meridian-linux-packages
        path: dist/*

  # ---------------------------------------------------------------------------
  # 2. GitHub Release Automation (on Tag)
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [linux-build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download Linux Artifacts
      uses: actions/download-artifact@v4
      with:
        name: meridian-linux-packages
        path: release_assets/

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: release_assets/*
        generate_release_notes: true
        draft: false
        prerelease: false
