name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (Ubuntu 24.04, Qt 6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build qt6-base-dev qt6-svg-dev libgl-dev \
            desktop-file-utils appstream

      - name: Configure (CMake, GUI on, warnings as errors)
        run: cmake -S . -B build-cmake -G Ninja -DZEPHYR_BUILD_GUI=ON -DZEPHYR_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build-cmake

      - name: Unit tests + PTY integration tests (CTest)
        run: ctest --test-dir build-cmake --output-on-failure

      - name: "GUI smoke test (offscreen): start, run a command in a PTY, exit cleanly"
        env:
          QT_QPA_PLATFORM: offscreen
          ZEPHYR_CONFIG_HOME: ${{ runner.temp }}/zephyr-config
        run: |
          ./build-cmake/zephyr-terminal --version
          # The window must close by itself once the command's shell exits.
          timeout 30 ./build-cmake/zephyr-terminal -e sh -c 'echo zephyr-smoke-ok'
          echo "zephyr-terminal exited with $?"

      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate packaging/desktop/org.zephyr_terminal.ZephyrTerminal.desktop
          appstreamcli validate --no-net packaging/desktop/org.zephyr_terminal.ZephyrTerminal.metainfo.xml

      - name: Install into a staging prefix
        run: |
          DESTDIR="$PWD/stage" cmake --install build-cmake --prefix /usr
          find stage -type f | sort

      - name: Makefile build (CLI, shell, tests)
        run: |
          make -j"$(nproc)" all
          make test
          make manual-test

  sanitizers:
    name: AddressSanitizer + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build
      - name: Build with sanitizers (no GUI)
        run: |
          cmake -S . -B build-asan -G Ninja -DZEPHYR_BUILD_GUI=OFF -DZEPHYR_ENABLE_ASAN=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-asan
      - name: Run tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build-asan --output-on-failure

  packages:
    name: Packages
    uses: ./.github/workflows/packages.yml
