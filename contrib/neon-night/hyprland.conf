# Optional: let Hyprland draw the glow border and add real background blur.
# Append to ~/.config/hypr/hyprland.conf. Then in Zephyr turn OFF
# "Rounded window with a glowing border" (Hyprland draws it) but keep
# "Minimal window" and a background opacity around 80%.
# Syntax for Hyprland >= 0.45 (the `shadow { }` block).

env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1   # no Qt client-side title bar

general {
    border_size = 2
    col.active_border = rgba(ff5fd2ff) rgba(8b7cf6ff) 45deg
    col.inactive_border = rgba(3a3550aa)
}

decoration {
    rounding = 14
    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 22
        render_power = 3
        color = rgba(ff5fd255)
    }
}

# Float Zephyr at a pleasant size, like the screenshot (remove to keep tiling).
windowrulev2 = float, class:^(zephyr-terminal)$
windowrulev2 = size 760 520, class:^(zephyr-terminal)$
