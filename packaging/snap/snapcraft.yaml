name: zephyr-terminal
base: core24
version: '0.1.0'
summary: Independently engineered Linux terminal emulator with built-in shell and local AI
description: |
  Zephyr Terminal is an independently engineered Linux terminal emulator (C++20),
  featuring an ANSI/VT screen engine, an optional standalone Zephyr Shell with
  full POSIX job control, and an offline local-only Zephyr AI assistant.

grade: stable
confinement: classic

apps:
  zephyr-terminal:
    command: usr/bin/zephyr-shell
    plugs:
      - home
      - network
      - removable-media
  zephyr:
    command: usr/bin/zephyr
    plugs:
      - home
  zephyr-shell:
    command: usr/bin/zephyr-shell
    plugs:
      - home
      - network

parts:
  zephyr-terminal:
    plugin: make
    source: .
    build-packages:
      - g++
      - make
      - libc6-dev
    make-parameters:
      - PREFIX=/usr
    override-build: |
      make all
      make install DESTDIR=$CRAFT_PART_INSTALL PREFIX=/usr

